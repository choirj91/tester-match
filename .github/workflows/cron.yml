name: Cron Jobs

on:
  schedule:
    # ── KST 기준 (UTC+9) ──────────────────────────────
    # 매일 KST 16:00 (UTC 07:00) — 체크인 리마인더.
    # GitHub 스케줄이 이 저장소에서 3~6시간 늦게 실행돼(2026-09-30~10-04 실측) 실제 도착은 KST 19~22시
    - cron: "0 7 * * *"
    # 매일 KST 21:00 (UTC 12:00) — 미체크인 페널티 sweep
    - cron: "0 12 * * *"
    # 6시간 간격 — 앱 초대 링크 HEAD 검증
    - cron: "0 */6 * * *"
    # 매일 KST 09:00 (UTC 00:00) — 급구 자동 만료 sweep + D-1 알림
    - cron: "0 0 * * *"
    # 매주 월요일 KST 10:00 (UTC 01:00) — 주간 인기글 전 회원 알림 (멱등)
    - cron: "0 1 * * 1"
    # 매일 KST 08:30 (UTC 23:30 전날) — 유료 주문 스윕(미결제 복구·7일 충원 마감·종결) + 관리자 리포트
    - cron: "30 23 * * *"
    # 6시간 간격(매 15분) — 유료 시트 보상 자동 확정(구매자 3일 무응답) + 보류 누락 보정 + 출시 보너스
    - cron: "15 */6 * * *"
  # 수동 실행 지원 (Dashboard Actions 탭 → Run workflow)
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 작업"
        required: true
        type: choice
        options:
          - daily-checkin-reminder
          - penalty-sweep
          - validate-app-urls
          - boost-expiry-sweep
          - weekly-hot-posts
          - paid-orders-report
          - seat-reward-release
          - all

env:
  # 커스텀 도메인 이전(2026-08) 후 고정 — pages.dev 는 308 리다이렉트라 직접 호출 필요.
  # (curl 은 cross-host 리다이렉트에서 Authorization 헤더를 제거하므로 -L 로는 해결 불가)
  APP_URL: https://tester-match.knockknock.company
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  # ── 체크인 리마인더 (KST 16:00 예약, 실제 도착 19~22시) ──
  checkin-reminder:
    name: 체크인 리마인더
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.job == 'daily-checkin-reminder' || inputs.job == 'all') ||
      github.event_name == 'schedule' && github.event.schedule == '0 7 * * *'
    steps:
      - name: Call /api/cron/daily-checkin-reminder
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/daily-checkin-reminder" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "HTTP $STATUS"
          [ "$STATUS" -eq 200 ] || exit 1

  # ── 페널티 sweep (KST 21:00) ────────────────────────
  penalty-sweep:
    name: 페널티 Sweep
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.job == 'penalty-sweep' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 12')
    steps:
      - name: Call /api/cron/penalty-sweep (repeat until done)
        run: |
          # 요청당 처리량 상한 때문에 몇 건씩 처리한다 — more=false 까지 반복 (최대 40회)
          for i in $(seq 1 40); do
            STATUS=$(curl -s --max-time 60 -o /tmp/body.json -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/penalty-sweep" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" || true)
            echo "penalty #$i HTTP $STATUS"
            cat /tmp/body.json || true
            echo
            [ "$STATUS" = "200" ] || exit 1
            grep -q '"more":true' /tmp/body.json || break
          done

  # ── 급구 자동 만료 sweep (KST 09:00) ────────────────
  boost-expiry-sweep:
    name: 급구 만료 Sweep
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.job == 'boost-expiry-sweep' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 0 ')
    steps:
      - name: Call /api/cron/boost-expiry-sweep
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/boost-expiry-sweep" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "HTTP $STATUS"
          [ "$STATUS" -eq 200 ] || exit 1

  # ── 주간 인기글 알림 (매주 월요일 KST 10:00) ────────
  weekly-hot-posts:
    name: 주간 인기글 알림
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.job == 'weekly-hot-posts' || inputs.job == 'all') ||
      github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1'
    steps:
      - name: Call /api/cron/weekly-hot-posts
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/weekly-hot-posts" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "HTTP $STATUS"
          [ "$STATUS" -eq 200 ] || exit 1

  # ── 유료 테스터 일일 리포트 (매일 KST 08:30) ────────
  paid-orders-report:
    name: 유료 테스터 리포트
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.job == 'paid-orders-report' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '30 23')
    steps:
      - name: Sweep paid orders, then send report
        run: |
          # 스윕은 요청당 처리량 상한 때문에 몇 건씩 처리한다 — more=false 까지 반복 (최대 40회)
          SWEEP_FAILED=0
          for i in $(seq 1 40); do
            STATUS=$(curl -s --max-time 60 -o /tmp/body.json -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/paid-orders-report?mode=sweep" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" || true)
            echo "sweep #$i HTTP $STATUS"
            cat /tmp/body.json || true
            echo
            if [ "$STATUS" != "200" ]; then SWEEP_FAILED=1; break; fi
            grep -q '"more":true' /tmp/body.json || break
          done
          # 스윕이 실패해도 리포트(운영 경보)는 보낸다 — 응답 본문을 로그에 남긴다
          STATUS=$(curl -s --max-time 60 -o /tmp/body.json -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/paid-orders-report" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" || true)
          echo "report HTTP $STATUS"
          cat /tmp/body.json || true
          [ "$STATUS" = "200" ] || exit 1
          [ "$SWEEP_FAILED" -eq 0 ] || exit 1

  # ── 유료 시트 보상 자동 확정 (6시간 간격) ────────────
  seat-reward-release:
    name: 시트 보상 자동 확정
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.job == 'seat-reward-release' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '15 */6')
    steps:
      - name: Call /api/cron/seat-reward-release (repeat until done)
        run: |
          # 자동 확정·보정·출시 보너스를 몇 건씩 처리한다 — more=false 까지 반복 (최대 40회)
          for i in $(seq 1 40); do
            STATUS=$(curl -s --max-time 60 -o /tmp/body.json -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/seat-reward-release" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" || true)
            echo "release #$i HTTP $STATUS"
            cat /tmp/body.json || true
            echo
            [ "$STATUS" = "200" ] || exit 1
            grep -q '"more":true' /tmp/body.json || break
          done

  # ── 앱 링크 검증 (6시간 간격) ────────────────────────
  validate-urls:
    name: 앱 URL 검증
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.job == 'validate-app-urls' || inputs.job == 'all') ||
      github.event_name == 'schedule' && startsWith(github.event.schedule, '0 */6')
    steps:
      - name: Call /api/cron/validate-app-urls
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/validate-app-urls" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "HTTP $STATUS"
          [ "$STATUS" -eq 200 ] || exit 1
