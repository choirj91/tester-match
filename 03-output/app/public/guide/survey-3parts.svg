<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Pretendard, -apple-system, sans-serif">
  <rect width="800" height="340" fill="#f8fafc"/>
  <text x="400" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">프로덕션 액세스 신청 설문 — 3개 파트로 구성</text>
  <!-- part1 -->
  <rect x="40" y="56" width="232" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="40" y="56" width="232" height="42" rx="12" fill="#2563eb"/>
  <rect x="40" y="86" width="232" height="12" fill="#2563eb"/>
  <text x="156" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">파트 1 · 비공개 테스트</text>
  <text x="58" y="124" font-size="11.5" fill="#334155">• 테스터를 어떻게 모집했고</text>
  <text x="66" y="140" font-size="11.5" fill="#334155">얼마나 어려웠는지</text>
  <text x="58" y="162" font-size="11.5" fill="#334155">• 테스터들의 참여도</text>
  <text x="66" y="178" font-size="11.5" fill="#334155">(기능 사용률·사용 패턴)</text>
  <text x="58" y="200" font-size="11.5" fill="#334155">• 받은 피드백 요약과</text>
  <text x="66" y="216" font-size="11.5" fill="#334155">수집 방법</text>
  <text x="58" y="252" font-size="10.5" fill="#2563eb" font-weight="700">→ 커뮤니티 댓글·피드백을</text>
  <text x="66" y="266" font-size="10.5" fill="#2563eb" font-weight="700">그대로 인용하면 좋음</text>
  <!-- part2 -->
  <rect x="284" y="56" width="232" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="284" y="56" width="232" height="42" rx="12" fill="#0ea5e9"/>
  <rect x="284" y="86" width="232" height="12" fill="#0ea5e9"/>
  <text x="400" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">파트 2 · 앱 정보</text>
  <text x="302" y="124" font-size="11.5" fill="#334155">• 주요 사용자층은 누구인지</text>
  <text x="302" y="150" font-size="11.5" fill="#334155">• 앱이 제공하는 가치·</text>
  <text x="310" y="166" font-size="11.5" fill="#334155">다른 앱과의 차별점</text>
  <text x="302" y="192" font-size="11.5" fill="#334155">• 첫해 예상 설치 수</text>
  <text x="310" y="208" font-size="11.5" fill="#334155">(범위 선택형)</text>
  <text x="302" y="252" font-size="10.5" fill="#0284c7" font-weight="700">→ 과장 없이 현실적인</text>
  <text x="310" y="266" font-size="10.5" fill="#0284c7" font-weight="700">범위를 고르세요</text>
  <!-- part3 -->
  <rect x="528" y="56" width="232" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="528" y="56" width="232" height="42" rx="12" fill="#10b981"/>
  <rect x="528" y="86" width="232" height="12" fill="#10b981"/>
  <text x="644" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">파트 3 · 출시 준비</text>
  <text x="546" y="124" font-size="11.5" fill="#334155">• 테스트에서 배운 것으로</text>
  <text x="554" y="140" font-size="11.5" fill="#334155">무엇을 바꿨는지</text>
  <text x="546" y="166" font-size="11.5" fill="#334155">• 프로덕션 준비가 됐다고</text>
  <text x="554" y="182" font-size="11.5" fill="#334155">판단한 근거</text>
  <text x="546" y="238" font-size="10.5" fill="#047857" font-weight="700">→ &ldquo;피드백 → 개선&rdquo; 연결이</text>
  <text x="554" y="252" font-size="10.5" fill="#047857" font-weight="700">구체적으로 드러나야 함</text>
  <text x="400" y="310" text-anchor="middle" font-size="11.5" fill="#64748b">불완전한 답변은 그 자체로 거부 사유 · 심사는 보통 7일 이내 이메일 통지 (Google Play Console 공식 도움말 기준)</text>
</svg>
