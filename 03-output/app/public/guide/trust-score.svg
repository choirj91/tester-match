<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Pretendard, -apple-system, sans-serif">
  <rect width="800" height="260" fill="#f8fafc"/>
  <text x="400" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">신뢰도(★) 점수는 이렇게 움직입니다 — 시작 50점, 최대 1,000점</text>
  <!-- +1 -->
  <rect x="48" y="60" width="220" height="150" rx="14" fill="#ecfdf5" stroke="#10b981"/>
  <text x="158" y="98" text-anchor="middle" font-size="30" font-weight="800" fill="#059669">+1</text>
  <text x="158" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">매일 체크인</text>
  <text x="158" y="150" text-anchor="middle" font-size="11" fill="#047857">참여 중인 테스트마다 하루 1회</text>
  <text x="158" y="168" text-anchor="middle" font-size="11" fill="#047857">14일 완주 = +14</text>
  <text x="158" y="194" text-anchor="middle" font-size="10.5" fill="#059669" font-weight="700">유일한 가점 경로</text>
  <!-- -3 -->
  <rect x="290" y="60" width="220" height="150" rx="14" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="400" y="98" text-anchor="middle" font-size="30" font-weight="800" fill="#d97706">−3</text>
  <text x="400" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">알리고 그만두기 (옵트아웃)</text>
  <text x="400" y="150" text-anchor="middle" font-size="11" fill="#a16207">사정이 생겨 중도 포기할 때</text>
  <text x="400" y="168" text-anchor="middle" font-size="11" fill="#a16207">버튼으로 미리 알리는 경우</text>
  <text x="400" y="194" text-anchor="middle" font-size="10.5" fill="#d97706" font-weight="700">개발자가 정원을 바로 채울 수 있음</text>
  <!-- -10 -->
  <rect x="532" y="60" width="220" height="150" rx="14" fill="#fef2f2" stroke="#ef4444"/>
  <text x="642" y="98" text-anchor="middle" font-size="30" font-weight="800" fill="#dc2626">−10</text>
  <text x="642" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">무단 이탈</text>
  <text x="642" y="150" text-anchor="middle" font-size="11" fill="#b91c1c">알리지 않고 사라지거나</text>
  <text x="642" y="168" text-anchor="middle" font-size="11" fill="#b91c1c">5일 연속 미체크인</text>
  <text x="642" y="194" text-anchor="middle" font-size="10.5" fill="#dc2626" font-weight="700">개발자의 14일 카운트를 망가뜨림</text>
  <text x="400" y="242" text-anchor="middle" font-size="11.5" fill="#64748b">앱 등록 수·게시글 수에는 점수를 주지 않습니다 — 오직 성실한 테스트 참여만 점수가 됩니다</text>
</svg>
