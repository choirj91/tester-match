<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Pretendard, -apple-system, sans-serif">
  <rect width="800" height="430" fill="#f8fafc"/>
  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Play Console › 테스트 › 비공개 테스트 › 테스터 탭 (구성 예시)</text>
  <!-- browser frame -->
  <rect x="40" y="48" width="720" height="350" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="40" y="48" width="720" height="34" rx="10" fill="#f1f5f9"/>
  <circle cx="62" cy="65" r="5" fill="#f87171"/><circle cx="80" cy="65" r="5" fill="#fbbf24"/><circle cx="98" cy="65" r="5" fill="#34d399"/>
  <text x="130" y="69" font-size="11" fill="#64748b">play.google.com/console › 테스트 › 비공개 테스트</text>
  <!-- tabs -->
  <text x="70" y="112" font-size="12" fill="#64748b">출시</text>
  <text x="120" y="112" font-size="12" font-weight="700" fill="#2563eb">테스터</text>
  <rect x="116" y="120" width="46" height="3" rx="1.5" fill="#2563eb"/>
  <line x1="60" y1="126" x2="740" y2="126" stroke="#e2e8f0"/>
  <!-- radio: email list -->
  <circle cx="80" cy="156" r="7" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="98" y="161" font-size="12.5" fill="#475569">이메일 목록으로 테스터 관리</text>
  <!-- radio: google groups (selected) -->
  <circle cx="80" cy="192" r="7" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="80" cy="192" r="3.5" fill="#2563eb"/>
  <text x="98" y="197" font-size="12.5" font-weight="700" fill="#0f172a">Google 그룹스로 테스터 관리 ← 이걸 선택</text>
  <!-- input -->
  <rect x="98" y="212" width="420" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="112" y="237" font-size="13" fill="#0f172a" font-family="monospace">tester-match@googlegroups.com</text>
  <rect x="530" y="212" width="76" height="40" rx="8" fill="#2563eb"/>
  <text x="568" y="237" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">저장</text>
  <text x="98" y="272" font-size="11" fill="#64748b">✱ 반드시 @googlegroups.com 으로 끝나는 일반 그룹 — Workspace 커스텀 도메인 그룹은 인식 안 될 수 있음</text>
  <!-- invite links -->
  <line x1="60" y1="290" x2="740" y2="290" stroke="#e2e8f0"/>
  <text x="70" y="315" font-size="12.5" font-weight="700" fill="#0f172a">참여 방법 (초대 링크)</text>
  <rect x="70" y="328" width="300" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="84" y="349" font-size="11.5" fill="#475569">🔗 웹 링크 복사 — play.google.com/apps/testing/…</text>
  <rect x="386" y="328" width="300" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="400" y="349" font-size="11.5" fill="#475569">🔗 Android 링크 복사 — play.google.com/apps/test/…</text>
  <text x="400" y="418" text-anchor="middle" font-size="11" fill="#94a3b8">실제 화면 구성을 바탕으로 Tester Match 가 재구성한 안내 이미지입니다</text>
</svg>
